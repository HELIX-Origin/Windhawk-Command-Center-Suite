theme: ''
styleConstants:
  - Translucent=<WindhawkBlur BlurAmount="15" TintColor="#10808080"/>
  - Glass=<WindhawkBlur BlurAmount="5" TintColor="{ThemeResource SystemChromeMediumColor}" TintOpacity="0.7" />
  - Frosted=<WindhawkBlur BlurAmount="20" TintColor="{ThemeResource SystemChromeMediumColor}" TintOpacity="0.7" />
  - Acrylic=<WindhawkBlur BlurAmount="30" TintColor="{ThemeResource SystemChromeMediumColor}" TintOpacity="0.8" />
  - Background=$Frosted
  - BorderBrush=<LinearGradientBrush StartPoint="0,0" EndPoint="0,1"><GradientStop Color="#60808080" Offset="0.0" /><GradientStop Color="#50404040" Offset="0.25" /><GradientStop Color="#40808080" Offset="1" /></LinearGradientBrush>
  - BorderBrush2=<WindhawkBlur BlurAmount="10" TintColor="#909090" TintOpacity="0.3"/>
  - OverlayColor=<AcrylicBrush TintColor="{ThemeResource SystemAltLowColor}" TintOpacity="1" TintLuminosityOpacity="0.8" FallbackColor="{ThemeResource CardStrokeColorDefaultSolid}" />
  - OverlayColor2=<AcrylicBrush TintColor="{ThemeResource SystemAltLowColor}" TintOpacity="1" TintLuminosityOpacity="0.5" FallbackColor="{ThemeResource CardStrokeColorDefaultSolid}" />
  - AccentColor=<AcrylicBrush TintColor="{ThemeResource SystemAccentColor}" TintOpacity="1" TintLuminosityOpacity="0.5" FallbackColor="{ThemeResource CardStrokeColorDefaultSolid}" />
  - ElementBackground=<SolidColorBrush Color="{ThemeResource SystemAltLowColor}" Opacity="0.25" />
  - ClockBG=<SolidColorBrush Color="{ThemeResource SystemAccentColor}" Opacity="1"/>
  - BorderThickness=0.3,1,0.3,1
  - CornerRadius=35
  - PanelRadius=15
  - CardRadius=10
  - ChipRadius=6
  - SearchBoxRadius=10
controlStyles:
  # LockApp.exe (Lock Screen Clock, Date, Widgets, Media Controls)
  - target: StackPanel#TimeAndDatePanel
    styles:
      - VerticalAlignment=Top
      - HorizontalAlignment=Center
      - RenderTransform:=<TranslateTransform X="0" />

  - target: StackPanel#TimePanel > TextBlock#Time
    styles:
      - HorizontalAlignment:=Center
      - RenderTransform:=<TransformGroup><TranslateTransform X="-50" Y="20" /><ScaleTransform ScaleX="2.3" ScaleY="4" /></TransformGroup>
      - FontFamily=Morganite SemiBold
      - Foreground:=$ClockBG

  - target: StackPanel#TimeAndDatePanel > TextBlock#Date
    styles:
      - HorizontalAlignment=Center
      - RenderTransform:=<TranslateTransform X="0" Y="-110" />
      - FontFamily=vivo Sans EN VF
      - Foreground:=$ClockBG

  - target: Grid#WidgetFrameGrid
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CornerRadius

  - target: Grid#WidgetCanvasPanel
    styles:
      - HorizontalAlignment=Center
      - RenderTransform:=<TranslateTransform X="0" Y="50" />

  - target: Grid#MediaTransportControls
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CornerRadius

  - target: Grid#MediaControlsContainer
    styles:
      - Visibility=0
      - RenderTransform:=<TranslateTransform X="0" Y="-250" />
      - Margin=0,0,0,0
      - CornerRadius=$CornerRadius

  # Foundation Start Menu Background & Sizing (StartMenuExperienceHost.exe)
  - target: StartDocked.StartSizingFrame
    styles:
      - Width=750
      - Height=700

  - target: Grid#MainMenu
    styles:
      - Width=470
      - Height=700

  - target: Border#DropShadowDismissTarget
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$PanelRadius
      - Margin=0
      - Padding=0

  - target: Grid#MainMenu > Border#AcrylicBorder, Border#AcrylicBorder
    styles:
      - Background:=Transparent
      - BorderBrush:=Transparent
      - BorderThickness=0

  - target: Border#AcrylicOverlay
    styles:
      - Visibility=Collapsed

  - target: Border#RootGridDropShadow, Border#StartDropShadow, Border#RightCompanionDropShadow, Border#dropshadow
    styles:
      - Visibility=Collapsed

  - target: Border#LayerBorder, Border#AccentLayerBorder, Border#AccentAppBorder
    styles:
      - Visibility=Collapsed

  # Start Menu Top Search Pill (aligned with cards, non-clipping)
  - target: StartMenu.SearchBoxToggleButton#SearchBoxToggleButton
    styles:
      - Height=40
      - Width=340
      - HorizontalAlignment=Center
      - Margin=0,16,0,8

  - target: StartMenu.SearchBoxToggleButton#SearchBoxToggleButton > Grid > Border#BorderElement
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$SearchBoxRadius

  - target: StartDocked.SearchBoxToggleButton#StartMenuSearchBox > Grid > ContentPresenter#ContentPresenter > TextBlock#PlaceholderText
    styles:
      - Text=Search This Precision

  # Selected Style for Taskbar Search Box (matches taskbar theme height 32, chip radius 6, centered)
  - target: Cortana.UI.Views.CortanaRichSearchBox#SearchTextBox
    styles:
      - Height=32
      - MaxHeight=32
      - VerticalAlignment=Center

  - target: Cortana.UI.Views.CortanaRichSearchBox#SearchTextBox > Grid > Border#BorderElement
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$ChipRadius
      - Height=32
      - VerticalAlignment=Center

  - target: Border#TaskbarSearchBackground
    styles:
      - CornerRadius=$ChipRadius
      - Height=32
      - VerticalAlignment=Center
      - Background:=Transparent
      - BorderBrush:=Transparent
      - BorderThickness=0

  - target: Cortana.UI.Views.TaskbarSearchPage > Grid#RootGrid > Grid#OuterBorderGrid
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$PanelRadius

  # Layered Category Cards (View: Category)
  - target: StartMenu.CategoryControl > Grid#RootGrid > Border
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  - target: StartMenu.CategoryControl > Grid > Border
    styles:
      - BackgroundSizing=InnerBorderEdge

  - target: Button#SeeAllButton > Grid > Border#BackgroundBorder
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$ChipRadius
      - Margin=18,4

  - target: Grid > LogosContainer > ItemsControl > ItemsPresenter > ItemsWrapGrid
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  # Section Header Texts (Hidden per Command Center design)
  - target: TextBlock#PinnedListHeaderText, TextBlock#TopLevelSuggestionsListLeaderText, Grid#TopLevelSuggestionsListHeader > TextBlock, TextBlock#AllListHeadingText, Grid#AllListHeading > TextBlock, TextBlock#AllAppsHeader
    styles:
      - Visibility=Collapsed

  # Pinned List Card
  - target: StartMenu.PinnedList#StartMenuPinnedList > Grid#Root
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  - target: StartMenu.PinnedList#StartMenuPinnedList
    styles:
      - Width=360
      - MaxHeight=400
      - MinHeight=200
      - Height=Auto
      - HorizontalAlignment=Center

  - target: GridView#PinnedList > Border > ScrollViewer
    styles:
      - ScrollViewer.VerticalScrollMode=2
      - MaxHeight:=336
      - MinHeight:=100
      - Width=360
      - Padding=0,10
      - Margin=0
      - HorizontalAlignment=Center

  # Recent / Recommended Section (Hidden per Command Center design)
  - target: Grid#TopLevelSuggestionsRoot, Grid#TopLevelSuggestionsContainerParent, Grid#TopLevelSuggestionsContainer, Grid#TopLevelSuggestionsListHeader, Windows.UI.Xaml.Controls.Grid#TopLevelSuggestionsListHeader, Windows.UI.Xaml.Controls.Grid#NoTopLevelSuggestionsText, Windows.UI.Xaml.Controls.GridView#RecommendedList, Windows.UI.Xaml.Controls.Grid#ShowMoreSuggestions
    styles:
      - Visibility=Collapsed

  # All Apps Views & View Selection Button
  - target: Button#ShowAllAppsButton, Grid#TopLevelHeader > Grid > Button
    styles:
      - Visibility=1

  - target: Grid#AllListHeading
    styles:
      - Margin=16,6,16,4

  - target: Grid#AllListHeading > Microsoft.UI.Xaml.Controls.DropDownButton#ViewSelectionButton > Grid#RootGrid
    styles:
      - CornerRadius=$ChipRadius
      - Margin=-12,0,12,0

  - target: GridView#AllAppsGrid > ItemsWrapGrid
    styles:
      - Visibility=0

  - target: GridViewHeaderItem, ListViewHeaderItem
    styles:
      - Foreground:={ThemeResource SystemControlPageTextBaseHighBrush}
      - FontSize=12
      - Margin=10,6,0,2
  
  # Hide "Most used" Section Header in All Apps Views
  - target: Button#Header[Content=Most used], Button[Content=Most used], GridViewHeaderItem[Content=Most used], ListViewHeaderItem[Content=Most used], TextBlock[Text=Most used], TextBlock#Text[Text=Most used]
    styles:
      - Visibility=Collapsed
      - Height=0

  # All Apps List View Items (View: List)
  - target: StartDocked.AppListViewItem, StartDocked.AppListViewItem > Grid@CommonStates > Border
    styles:
      - Background@PointerOver:=$OverlayColor2
      - Background@Pressed:=$OverlayColor
      - BorderBrush@PointerOver:=$BorderBrush
      - BorderBrush@Pressed:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$ChipRadius

  - target: StartDocked.AppListView#NavigationPanePlacesListView > Border
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius
      - Margin=10,0,10,0

  - target: StartDocked.NavigationPaneView#NavigationPane
    styles:
      - Width=550
      - RenderTransform:=<TranslateTransform X="0" Y="10" />

  # Right Companion (Phone Link panel - Merged into Start Menu glass surface)
  - target: StartMenu.StartMenuCompanion#RightCompanion
    styles:
      - Height=700

  - target: Grid#CompanionRoot > Border#AcrylicBorder, StartDocked.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Border#AcrylicBorder
    styles:
      - Background:=Transparent
      - BorderBrush:=Transparent
      - BorderThickness=0

  - target: Grid#CompanionRoot > Border#AcrylicOverlay, Grid#CompanionRoot > Grid#MainContent > Border#AcrylicOverlay
    styles:
      - Visibility=Collapsed

  - target: Border#RightCompanionDropShadow, Border#RightCompanionDropShadowDismissTarget
    styles:
      - Visibility=Collapsed

  - target: StartDocked.StartMenuCompanion#RightCompanion > Grid#CompanionRoot
    styles:
      - Height=700
      - Margin=-20,0,20,0
      - Padding=4,12,8,12

  # Hide All Scrollbars (Clean scrolling without unstylable WinUI scrollbars)
  - target: Windows.UI.Xaml.Controls.Primitives.ScrollBar, Primitives.ScrollBar, ScrollBar
    styles:
      - Visibility=1

  # Phone Link Companion Toggle Button (Aligned with 40px search box)
  - target: Windows.UI.Xaml.Controls.Primitives.ToggleButton#ShowHideCompanion, ToggleButton#ShowHideCompanion
    styles:
      - Height=40
      - Width=40
      - Margin=0,16,16,8

  - target: Windows.UI.Xaml.Controls.Primitives.ToggleButton#ShowHideCompanion > Border, ToggleButton#ShowHideCompanion > Border, ScrollViewer > ScrollContentPresenter > Border > StartMenu.StartBlendedFlexFrame > Grid#FrameRoot > Grid#AnimationRoot > Grid#MainMenu > Grid#MainContent > Grid > Windows.UI.Xaml.Controls.Primitives.ToggleButton#ShowHideCompanion > Border
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  # Phone Link: Hide Phone Graphic & iPhone Device Header Text
  - target: ScrollViewer > ScrollContentPresenter > Border > StartMenu.StartBlendedFlexFrame > Grid#FrameRoot > Grid#AnimationRoot > Grid#RightCompanionContainerGrid > StartMenu.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > ContentPresenter#PrimaryCardContainer > Grid > Grid > Border
    styles:
      - Visibility=1

  - target: Windows.UI.Xaml.Controls.TextBlock[Text=iPhone], TextBlock[Text=iPhone], ScrollViewer > ScrollContentPresenter > Border > StartMenu.StartBlendedFlexFrame > Grid#FrameRoot > Grid#AnimationRoot > Grid#RightCompanionContainerGrid > StartMenu.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > ContentPresenter#PrimaryCardContainer > Grid > Grid > TextBlock, ScrollViewer > ScrollContentPresenter > Border > StartMenu.StartBlendedFlexFrame > Grid#FrameRoot > Grid#AnimationRoot > Grid#RightCompanionContainerGrid > StartMenu.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > ContentPresenter#PrimaryCardContainer > Grid > Grid > Grid > TextBlock
    styles:
      - Visibility=1

  # Phone Link: Hide "Recent" Section Leader Text
  - target: ScrollViewer > ScrollContentPresenter > Border > StartMenu.StartBlendedFlexFrame > Grid#FrameRoot > Grid#AnimationRoot > Grid#RightCompanionContainerGrid > StartMenu.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > ContentPresenter#PrimaryCardContainer > Grid > Grid > Grid > ScrollViewer > Border#Root > Grid > ScrollContentPresenter#ScrollContentPresenter > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Border > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Grid > Border > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > TextBlock
    styles:
      - Visibility=1

  # Phone Link Card 1: Quick Actions (Messages, Calls, Send files)
  # This section needs to be moved further elft. Right now it is too close to the right edge
  - target: ScrollViewer > ScrollContentPresenter > Border > StartMenu.StartBlendedFlexFrame > Grid#FrameRoot > Grid#AnimationRoot > Grid#RightCompanionContainerGrid > StartMenu.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > ContentPresenter#PrimaryCardContainer > Grid > Grid > Grid > ScrollViewer > Border#Root > Grid > ScrollContentPresenter#ScrollContentPresenter > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Border > AdaptiveCards.Rendering.Uwp.WholeItemsPanel
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  # Phone Link Card 2: Recent Activity List (recent notifications)
  # This section needs to be moved further elft. Right now it is too close to the right edge
  - target: ScrollViewer > ScrollContentPresenter > Border > StartMenu.StartBlendedFlexFrame > Grid#FrameRoot > Grid#AnimationRoot > Grid#RightCompanionContainerGrid > StartMenu.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > ContentPresenter#PrimaryCardContainer > Grid > Grid > Grid > ScrollViewer > Border#Root > Grid > ScrollContentPresenter#ScrollContentPresenter > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Border > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Grid > Border > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Grid > ListView > Border, ScrollViewer > ScrollContentPresenter > Border > StartMenu.StartBlendedFlexFrame > Grid#FrameRoot > Grid#AnimationRoot > Grid#RightCompanionContainerGrid > StartMenu.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > ContentPresenter#PrimaryCardContainer > Grid > Grid > Grid > ScrollViewer > Border#Root > Grid > ScrollContentPresenter#ScrollContentPresenter > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Border > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Border > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Border > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Grid > Border > AdaptiveCards.Rendering.Uwp.WholeItemsPanel > Grid > ListView > Border
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  # Phone Link Scroll Container Constraint (Protects bottom bar from being pushed down)
  # This section needs to be moved further elft. Right now it is too close to the right edge
  - target: StartMenu.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > ContentPresenter#PrimaryCardContainer, StartDocked.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > ContentPresenter#PrimaryCardContainer, ContentPresenter#PrimaryCardContainer
    styles:
      - MaxHeight=570
      - VerticalAlignment=Top
      - Margin=0,0,0,54

  # Phone Link Bottom Card: ActionsBar (Anchored 42px bottom bar aligned flush with cards)
  - target: Windows.UI.Xaml.Controls.Grid#ActionsBar, StartMenu.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > Grid#ActionsBar, StartDocked.StartMenuCompanion#RightCompanion > Grid#CompanionRoot > Grid#MainContent > Grid#ActionsBar
    styles:
      - Height=42
      - MinHeight=42
      - VerticalAlignment=Bottom
      - Margin=19,0,8,12
      - Padding=6,2
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  - target: Windows.UI.Xaml.Controls.Grid#ActionsBar > Windows.UI.Xaml.Controls.Button#ActionBarOverflowButton, Windows.UI.Xaml.Controls.Grid#ActionsBar > Windows.UI.Xaml.Controls.Button#PrimaryActionBarButton, Grid#ActionsBar > Button
    styles:
      - Height=32
      - MinHeight=32
      - Width=40
      - VerticalAlignment=Center
      - HorizontalAlignment=Right
      - Background:=Transparent
      - BorderThickness=0
      - CornerRadius=$ChipRadius
      - Visibility=Visible

  # User Tile and Power Options
  - target: StartDocked.UserTileView > StartDocked.NavigationPaneButton > Grid@CommonStates > Border
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  - target: StartDocked.PowerOptionsView > StartDocked.NavigationPaneButton > Grid@CommonStates > Border
    styles:
      - Background:=$ElementBackground
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  - target: StartDocked.NavigationPaneButton#UserTileButton > Grid > ContentPresenter#ContentPresenter > Grid > Grid#UserTileIcon
    styles:
      - Height=24
      - Width=24

  - target: StartDocked.NavigationPaneButton#UserTileButton > Grid > ContentPresenter#ContentPresenter > Grid > TextBlock#UserTileNameText
    styles:
      - FontSize=12

  # Action Bar, Flyouts, Modals & Item States

  - target: FlyoutPresenter > Border#BackgroundElement
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness:=$BorderThickness
      - CornerRadius=$ChipRadius
      - Padding=-1

  - target: MenuFlyoutPresenter > Border#BackgroundElement, MenuFlyoutPresenter > Border
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$ChipRadius

  - target: MenuFlyoutItem, ToggleMenuFlyoutItem
    styles:
      - CornerRadius=$ChipRadius
      - Margin=4,0,4,0

  - target: Border#OverflowFlyoutBackgroundBorder, Grid#HoverFlyoutGrid > Border#HoverFlyoutBackground
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$ChipRadius

  - target: ToolTip > ContentPresenter#LayoutRoot
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$ChipRadius

  # Folder Modal Popup Glass Background & Layout
  - target: StartMenu.FolderModal#StartFolderModal > Grid#Root
    styles:
      - MaxHeight:=420
      - MaxWidth:=420
      - Height=Auto
      - Width=Auto

  - target: StartMenu.FolderModal#StartFolderModal > Grid#Root > ContentControl#ContentControl > ContentPresenter > StartMenu.UniversalTileContainer#UniversalTileContainer > Grid#GridViewContainer
    styles:
      - Width=360
      - Height=Auto

  - target: Grid#Root > Border, Border#AppBorder
    styles:
      - Background:=$Background
      - BorderBrush:=$BorderBrush
      - BorderThickness=$BorderThickness
      - CornerRadius=$CardRadius

  - target: StartMenu.ExpandedFolderList
    styles:
      - Margin=0

  - target: ListViewItem > Grid@CommonStates > Border#BorderBackground, Border#ContentBorder@CommonStates > Grid > Border#BackgroundBorder, Button > Grid@CommonStates > Border#BackgroundBorder
    styles:
      - BorderThickness=$BorderThickness
      - BorderBrush@PointerOver:=$BorderBrush
      - BorderBrush@Pressed:=$BorderBrush
      - CornerRadius=$CardRadius
      - BackgroundSizing=InnerBorderEdge

  - target: Border#BackgroundBorder, Grid#LayoutRoot
    styles:
      - BackgroundTransition:=<BrushTransition Duration="0:0:0.083" />

webContentStyles:
  - target: '*'
    styles:
      - 'transition: background-color 0.083s ease-in-out !important'
